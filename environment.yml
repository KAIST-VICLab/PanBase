# The environment the released numbers were produced in (Python 3.9, PyTorch 2.7.1 + CUDA 12.6).
name: panbase
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9.23
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.7.1
      - torchvision==0.22.1
      - numpy==2.0.2
      - scipy==1.13.1
      - h5py==3.14.0
      - scikit-image==0.24.0
      - einops==0.8.1
      - timm==1.0.29
      - kornia==0.8.2
      - PyWavelets==1.6.0
      - opencv-python==4.12.0.88
      - PyYAML==6.0.2
      - pillow==11.3.0
      - tqdm==4.67.1
      - safetensors==0.5.3
      # the README's `hf download` (0.33.x has only huggingface-cli); downloads only, no numerics
      - huggingface_hub==0.36.0
      # classical BDSD-PC (panbase.classical); its output depends on the solver version
      - cvxpy==1.7.5
      - piqp==0.6.4
      # TS-Pan: JIT build of RWKV's wkv CUDA kernel (CUDA_OPS.md)
      - ninja
      # MMMamba: mamba_ssm 1.2.0.post1 + causal_conv1d 1.2.0.post2, built from source (scripts/build_mamba_ssm.sh)
